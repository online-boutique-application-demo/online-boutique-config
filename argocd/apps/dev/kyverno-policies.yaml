apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/${GITHUB_ORG}/online-boutique-config.git
    targetRevision: ${CONFIG_REVISION}
    path: base/kyverno
    kustomize:
      patches:
        - target:
            group: kyverno.io
            version: v1
            kind: ClusterPolicy
            name: verify-image-signatures
          patch: |-
            - op: replace
              path: /spec/rules/0/verifyImages/0/attestors/0/entries/0/keyless/subject
              value: https://github.com/${GITHUB_ORG}/*
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
