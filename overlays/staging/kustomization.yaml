apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/online-boutique

configMapGenerator:
  - name: env-config
    envs:
      - env.properties
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

images:
  - name: REGISTRY/online-boutique/adservice
    newTag: latest
  - name: REGISTRY/online-boutique/cartservice
    newTag: latest
  - name: REGISTRY/online-boutique/checkoutservice
    newTag: latest
  - name: REGISTRY/online-boutique/currencyservice
    newTag: latest
  - name: REGISTRY/online-boutique/emailservice
    newTag: latest
  - name: REGISTRY/online-boutique/frontend
    newTag: latest
  - name: REGISTRY/online-boutique/loadgenerator
    newTag: latest
  - name: REGISTRY/online-boutique/paymentservice
    newTag: latest
  - name: REGISTRY/online-boutique/productcatalogservice
    newTag: latest
  - name: REGISTRY/online-boutique/recommendationservice
    newTag: latest
  - name: REGISTRY/online-boutique/shippingservice
    newTag: latest

replacements:
  - source:
      kind: ConfigMap
      name: env-config
      fieldPath: data.ECR_REGISTRY
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.*.image
        options:
          delimiter: '/'
          index: 0
  - source:
      kind: ConfigMap
      name: env-config
      fieldPath: data.REDIS_ADDR
    targets:
      - select:
          kind: Deployment
          name: cartservice
        fieldPaths:
          - spec.template.spec.containers.[name=server].env.[name=REDIS_ADDR].value
