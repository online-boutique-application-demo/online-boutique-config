apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/online-boutique-application-demo/online-boutique-config.git
    targetRevision: main
    path: base/istio
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
