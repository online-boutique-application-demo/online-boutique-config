apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Verify that container images from ECR are signed with Cosign
      using keyless signing via GitHub Actions OIDC.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - online-boutique
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/online-boutique/*"
          attestors:
            - entries:
                - keyless:
                    # Default placeholder; overridden via ArgoCD inline kustomize patch per environment
                    subject: "https://github.com/GITHUB_ORG/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
