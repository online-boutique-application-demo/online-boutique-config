apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers are not allowed in online-boutique namespace.
      This prevents containers from gaining full access to the host.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - online-boutique
      validate:
        message: "Privileged containers are not allowed in online-boutique namespace."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): false
