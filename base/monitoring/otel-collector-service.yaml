apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: grpc
    - name: http-otlp
      port: 4318
      targetPort: 4318
      protocol: TCP
      appProtocol: http
    - name: http-zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
      appProtocol: http
  selector:
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/name: opentelemetry-collector
    component: standalone-collector
