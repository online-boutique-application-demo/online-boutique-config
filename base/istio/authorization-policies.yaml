# Deny all by default in online-boutique namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: online-boutique
spec: {}
---
# Allow frontend to receive traffic from Istio Ingress Gateway and LoadGenerator
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/online-boutique/sa/loadgenerator"
---
# Allow cartservice to receive traffic from frontend and checkoutservice
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-cartservice
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: cartservice
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/online-boutique/sa/frontend"
              - "cluster.local/ns/online-boutique/sa/checkoutservice"
---
# Allow productcatalogservice to receive traffic from frontend, checkoutservice, and recommendationservice
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-productcatalogservice
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/online-boutique/sa/frontend"
              - "cluster.local/ns/online-boutique/sa/checkoutservice"
              - "cluster.local/ns/online-boutique/sa/recommendationservice"
---
# Allow currencyservice to receive traffic from frontend and checkoutservice
