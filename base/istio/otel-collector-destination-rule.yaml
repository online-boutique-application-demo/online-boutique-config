apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: otel-collector-disable-mtls
  namespace: istio-system
spec:
  host: otel-collector.monitoring.svc.cluster.local
  exportTo:
    - "*"
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: otel-collector-opentelemetry-disable-mtls
  namespace: istio-system
spec:
  host: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
  exportTo:
    - "*"
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: tempo-disable-mtls
  namespace: istio-system
spec:
  host: tempo.monitoring.svc.cluster.local
  exportTo:
    - "*"
  trafficPolicy:
    tls:
      mode: DISABLE
