apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Readiness Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-readiness-probe
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - online-boutique
      validate:
        message: "Readiness probe is required for all containers."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - readinessProbe: {}
